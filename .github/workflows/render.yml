name: Render 2K 90FPS Master

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  render-shard:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 0
          - shard: 1
          - shard: 2
          - shard: 3
          - shard: 4
          - shard: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render shard ${{ matrix.shard }}
        run: |
          mkdir -p out
          TOTAL=$(grep -o 'totalFrames: [0-9]*' scenes/timing.ts | head -1 | grep -o '[0-9]*')
          START=$(( TOTAL * ${{ matrix.shard }} / 6 ))
          END=$(( TOTAL * (${{ matrix.shard }} + 1) / 6 - 1 ))
          echo "shard ${{ matrix.shard }}: frames $START-$END of $TOTAL"
          npx remotion render scenes/film.tsx Naysi "out/shard_${{ matrix.shard }}.mp4" \
            --frames="$START-$END" \
            --muted \
            --codec=h264 \
            --crf=18 \
            --pixel-format=yuv420p \
            --jpeg-quality=94 \
            --concurrency=4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard_${{ matrix.shard }}.mp4
          compression-level: 0
          retention-days: 5

  assemble:
    needs: render-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Concatenate 2K 90fps shards and mux 320kbps audio
        run: |
          set -euo pipefail
          mkdir -p out/qa
          rm -f concat.txt
          for i in 0 1 2 3 4 5; do
            f=$(find "shards/shard-${i}" -name "shard_${i}.mp4" | head -n 1)
            test -n "$f" && test -s "$f"
            echo "file '$f'" >> concat.txt
          done

          VIDEO_OUT="8 Menit Setelah Matahari Mati, Bumi Masih Mengorbit Ketiadaannya - Naysi - 1440x2560 90fps.mp4"
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -i public/audio/master.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -c:a aac -b:a 320k -ar 48000 \
            -movflags +faststart \
            "$VIDEO_OUT"

          {
            echo "=== VIDEO STREAM ==="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
            echo "=== AUDIO STREAM ==="
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels,bit_rate \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
          } | tee out/qa/probe.txt

          TIMES=(4.00 10.00 20.00 26.00 34.00 40.00 50.00 57.00 64.00 70.00 80.00 88.00 97.00 102.00 110.00 118.00)
          for idx in "${!TIMES[@]}"; do
            num=$(printf "%02d" $((idx + 1)))
            ffmpeg -y -v error -ss "${TIMES[$idx]}" -i "$VIDEO_OUT" -frames:v 1 -vf "scale=540:960" "out/qa/f_${num}.jpg"
          done
          ffmpeg -y -v error -start_number 1 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x090D0C" "out/qa/qa_sheet_1.jpg"
          ffmpeg -y -v error -start_number 9 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x090D0C" "out/qa/qa_sheet_2.jpg"

          ffmpeg -y -v error -ss 10.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch1.jpg"
          ffmpeg -y -v error -ss 12.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch1b.jpg"
          ffmpeg -y -v error -ss 26.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch2.jpg"
          ffmpeg -y -v error -ss 40.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch3.jpg"
          ffmpeg -y -v error -ss 57.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch4.jpg"
          ffmpeg -y -v error -ss 70.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch5.jpg"
          ffmpeg -y -v error -ss 88.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch6.jpg"
          ffmpeg -y -v error -ss 102.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch7.jpg"
          ffmpeg -y -v error -ss 118.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch8.jpg"
          ffmpeg -y -v error -ss 128.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch9.jpg"
          ffmpeg -y -v error -ss 145.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch10.jpg"
          ffmpeg -y -v error -ss 158.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch11.jpg"
          ffmpeg -y -v error -ss 172.00 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch12.jpg"
          rm -f out/qa/f_*.jpg

          cat << 'PAKET_EOF' > "out/Paket YouTube - 8 Menit Setelah Matahari Mati.txt"
          Judul:
          8 Menit Setelah Matahari Mati, Bumi Masih Mengorbit Ketiadaannya

          Deskripsi:
          Kalau matahari padam detik ini, kamu tidak akan tahu apa-apa selama 8 menit 20 detik. Bumi tetap terang, tetap hangat, dan tetap mengorbit — karena cahaya dan gravitasi sama-sama butuh waktu untuk sampai ke kita. Setelah itu, semuanya berubah sekaligus.

          0:00 Cahaya yang menyentuhmu berangkat 8 menit lalu
          0:14 149.600.000 km ÷ 299.792 km/detik = 499 detik
          0:29 Bintang yang kamu lihat malam ini mungkin sudah mati
          0:44 Gravitasi juga bergerak secepat cahaya
          0:59 Orbit lepas: 107.000 km/jam ke luar tata surya
          1:13 Minggu pertama: suhu jatuh di bawah nol
          1:31 Bulan ikut padam, langit tinggal bintang
          1:44 Tahun pertama: −73 °C, laut membeku dari atas
          2:01 Kehidupan terakhir di sekitar ventilasi hidrotermal
          2:18 Raksasa merah menelan Merkurius dan Venus
          2:32 Bara putih seukuran bumi, mendingin selamanya
          2:45 Kamu selalu melihat matahari yang dulu

          Cahaya matahari menempuh 149,6 juta kilometer sebelum menyentuh wajahmu. Dengan kecepatan 299.792 kilometer per detik, perjalanan itu memakan 499 detik — 8 menit 19 detik. Artinya setiap kali kamu melihat matahari, kamu sedang menatap masa lalu: matahari yang sudah berubah sebelum cahayanya tiba di sini.

          Gravitasi juga merambat dengan kecepatan cahaya. Jadi dalam skenario mustahil matahari lenyap seketika, bumi masih mengorbit titik kosong selama 8 menit penuh, lalu melesat lurus ke luar tata surya dengan kecepatan 107.000 kilometer per jam.

          Tanpa energi matahari, planet ini kehilangan sumber panas utamanya. Menurut perhitungan ilmuwan planet David Stevenson (Caltech), suhu rata-rata permukaan bumi jatuh di bawah nol derajat Fahrenheit dalam sepekan, menyentuh sekitar −73°C dalam setahun, dan akhirnya stabil di kisaran −240°C ketika panas inti bumi hanya cukup menggantikan panas yang hilang ke angkasa. Lautan membeku dari permukaan, tetapi lapisan es itu justru menjadi selimut yang menjaga air di bawahnya tetap cair selama ratusan ribu tahun.

          Di dasar laut, di sekitar ventilasi hidrotermal bersuhu 400 °C, bakteri dan cacing tabung hidup tanpa cahaya sama sekali. Ekosistem itu tidak pernah butuh matahari sejak awal — dan ketika permukaan bumi sudah mati, mereka masih menyala.

          Yang paling mengejutkan: matahari sungguhan tidak akan pernah "padam seperti lampu". Sekitar 5 miliar tahun lagi, hidrogen di intinya habis, ia membengkak menjadi raksasa merah yang menelan Merkurius dan Venus, lalu melepas lapisan luarnya dan menyisakan bara putih seukuran bumi.

          Kalau matahari benar-benar bisa dimatikan malam ini, hal pertama apa yang kamu lakukan di kegelapan? Tulis di komentar.

          Sumber: NASA Sun Fact Sheet (jarak & luminositas matahari); kecepatan cahaya 299.792.458 m/s (BIPM); David Stevenson, Caltech — skenario hilangnya matahari (Popular Science/NASA Science News); teori evolusi bintang deret utama menuju raksasa merah dan bara putih (NASA/ESA).

          Naysi — penjelasan singkat soal sains, sejarah, dan angka di baliknya.
          Kerja sama: elths.i09@gmail.com

          Hashtag:
          #Shorts #Astronomi #Sains #FaktaUnik #Matahari

          Tag:
          matahari mati, kalau matahari hilang, 8 menit cahaya matahari, kecepatan cahaya, jarak matahari bumi, gravitasi kecepatan cahaya, bumi lepas orbit, suhu bumi tanpa matahari, raksasa merah, bara putih, evolusi bintang, astronomi, fakta astronomi, sains populer, fakta unik dunia, edukasi, ilmu pengetahuan, tata surya, naysi, shorts indonesia
          PAKET_EOF
          sed -i 's/^          //' "out/Paket YouTube - 8 Menit Setelah Matahari Mati.txt"
          ls -lh out/ out/qa/
      - name: Register Git object deliverables manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          def api_post(path, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def upload_blob(raw_bytes):
              res = api_post("git/blobs", {
                  "content": base64.b64encode(raw_bytes).decode("ascii"),
                  "encoding": "base64",
              })
              return res["sha"]

          tree_items = []
          video_path = "8 Menit Setelah Matahari Mati, Bumi Masih Mengorbit Ketiadaannya - Naysi - 1440x2560 90fps.mp4"
          chunk_size = 18 * 1024 * 1024
          with open(video_path, "rb") as vf:
              idx = 0
              while True:
                  buf = vf.read(chunk_size)
                  if not buf:
                      break
                  bsha = upload_blob(buf)
                  tree_items.append({
                      "path": f"video_part_{idx:02d}.bin",
                      "mode": "100644",
                      "type": "blob",
                      "sha": bsha,
                  })
                  idx += 1

          extra_files = {
              "paket.txt": "out/Paket YouTube - 8 Menit Setelah Matahari Mati.txt",
              "probe.txt": "out/qa/probe.txt",
              "qa_sheet_1.jpg": "out/qa/qa_sheet_1.jpg",
              "qa_sheet_2.jpg": "out/qa/qa_sheet_2.jpg",
              "hi_ch1.jpg": "out/qa/hi_ch1.jpg",
              "hi_ch1b.jpg": "out/qa/hi_ch1b.jpg",
              "hi_ch2.jpg": "out/qa/hi_ch2.jpg",
              "hi_ch3.jpg": "out/qa/hi_ch3.jpg",
              "hi_ch4.jpg": "out/qa/hi_ch4.jpg",
              "hi_ch5.jpg": "out/qa/hi_ch5.jpg",
              "hi_ch6.jpg": "out/qa/hi_ch6.jpg",
              "hi_ch7.jpg": "out/qa/hi_ch7.jpg",
              "hi_ch8.jpg": "out/qa/hi_ch8.jpg",
              "hi_ch9.jpg": "out/qa/hi_ch9.jpg",
              "hi_ch10.jpg": "out/qa/hi_ch10.jpg",
              "hi_ch11.jpg": "out/qa/hi_ch11.jpg",
              "hi_ch12.jpg": "out/qa/hi_ch12.jpg",
          }
          for name, fpath in extra_files.items():
              with open(fpath, "rb") as ef:
                  bsha = upload_blob(ef.read())
              tree_items.append({
                  "path": name,
                  "mode": "100644",
                  "type": "blob",
                  "sha": bsha,
              })

          tree = api_post("git/trees", {"tree": tree_items})
          tree_sha = tree["sha"]
          api_post(f"statuses/{sha}", {
              "state": "success",
              "context": "naysi/deliverables",
              "description": f"tree:{tree_sha}",
          })
          print("Registered deliverables tree:", tree_sha)
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: naysi-master-deliverables
          path: |
            *.mp4
            out/*.mp4
            out/*.txt
            out/qa/*.jpg
            out/qa/*.txt
          compression-level: 0
          retention-days: 30
