# Render on GitHub's machines, not on a workstation.
#
# Triggers, in order of how often they fire:
#
#   push (this branch)  → typecheck + master audio + one still per shot (~6 min)
#   push (tag v*)       → the above, then the full film + a release     (~40 min)
#   workflow_dispatch   → same as a tag push, with the tag as an input
#
# The dispatch entry point only appears once this file is on the default branch
# (GitHub's rule, not ours); a tag push works from any branch, today.
#
# Artifacts per run, kept 30 days:
#   still-<shot>-<frame>.png  one per shot, for review without a player
#   naysi_master.mp4         the film, audio muxed       (full runs only)
#   naysi_pack.zip           title / description / tags  (full runs only)
#   probe.txt, render.log    what came out, and how long it took
name: Render

on:
  workflow_dispatch:
    inputs:
      stills_only:
        description: 'Skip the film, render review stills only'
        type: boolean
        default: false
      release_tag:
        description: 'Publish the render as a release with this tag (optional)'
        type: string
        default: ''
  push:
    # Every push of work in progress gets a cheap, useful check; the expensive
    # render waits for a tag. Editing the workflow itself must not trigger a
    # 40-minute render, so `render.yml` alone does not match.
    branches: ['**']
    paths:
      - 'scenes/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
    tags: ['v*']

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish a release on a tag

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: |
          npm ci
          python3 -m pip install --quiet --break-system-packages numpy
          # Fetch the headless shell once, here, rather than racing on it inside
          # the render's worker tabs.
          npx remotion browser ensure

      - name: typecheck
        run: npx tsc --noEmit

      - name: narration + timeline + score + master bus
        run: node scripts/build.mjs --audio-only

      - name: one review still per shot
        run: |
          mkdir -p out
          node -e '
            const tl = require("./src/data/timeline.json");
            for (const s of tl.shots) {
              const f = Math.round((s.startFrame + s.outFrame) / 2);
              console.log(f, s.file);
            }
          ' > /tmp/shots.txt
          while read -r frame name; do
            npx remotion still src/index.ts sidereal "out/still-${name}-${frame}.png" --frame="$frame"
          done < /tmp/shots.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: stills-${{ github.run_number }}
          path: |
            out/still-*.png
            out/naysi_pack.zip
            src/data/timeline.json
          if-no-files-found: error
          retention-days: 30

  render:
    needs: stills
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: |
          npm ci
          python3 -m pip install --quiet --break-system-packages numpy
          npx remotion browser ensure

      - name: audio
        run: node scripts/build.mjs --audio-only

      - name: film
        # Four vCPUs on a standard runner; two tabs leave them idle. The picture
        # is vector work, so more tabs than cores only thrashes.
        env:
          NAYSI_CONCURRENCY: '4'
        run: |
          set -o pipefail
          node scripts/build.mjs --render-only 2>&1 | tee out/render.log

      - name: probe + decode
        run: |
          ffprobe -v error -show_entries \
            stream=codec_name,width,height,r_frame_rate,pix_fmt,bit_rate:format=duration,size \
            -of default=noprint_wrappers=1 out/naysi_master.mp4 | tee out/probe.txt
          # A 76 s 1440x2560 film below 3 MB is a broken render, not a good
          # encode. Fail here rather than shipping a black rectangle.
          test "$(stat -c%s out/naysi_master.mp4)" -gt 3000000
          ffmpeg -v error -i out/naysi_master.mp4 -f null - && echo 'decode ok'

      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ github.run_number }}
          path: |
            out/naysi_master.mp4
            out/naysi_pack.zip
            out/probe.txt
            out/render.log
          if-no-files-found: error
          retention-days: 30

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # Explicit: a release that stays a draft is not a delivery, and the
          # first run published a draft because the default is inherited from
          # the action's own inputs.
          draft: false
          fail_on_unmatched_files: true
          files: |
            out/naysi_master.mp4
            out/naysi_pack.zip
          body: |
            Rendered from `${{ github.sha }}` on a GitHub runner.
            `probe.txt` and `render.log` are in the run's artifacts.
