name: Render 2K 90FPS Master

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  render-shard:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 0
            range: '0-1683'
          - shard: 1
            range: '1684-3367'
          - shard: 2
            range: '3368-5051'
          - shard: 3
            range: '5052-6735'
          - shard: 4
            range: '6736-8419'
          - shard: 5
            range: '8420-10103'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render shard ${{ matrix.shard }} (${{ matrix.range }})
        run: |
          mkdir -p out
          npx remotion render scenes/y3.tsx Naysi "out/shard_${{ matrix.shard }}.mp4" \
            --frames="${{ matrix.range }}" \
            --muted \
            --codec=h264 \
            --crf=18 \
            --pixel-format=yuv420p \
            --jpeg-quality=94 \
            --concurrency=4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard_${{ matrix.shard }}.mp4
          compression-level: 0
          retention-days: 5

  assemble:
    needs: render-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Concatenate 2K 90fps shards and mux 320kbps audio
        run: |
          set -euo pipefail
          mkdir -p out/qa
          rm -f concat.txt
          for i in 0 1 2 3 4 5; do
            f=$(find "shards/shard-${i}" -name "shard_${i}.mp4" | head -n 1)
            test -n "$f" && test -s "$f"
            echo "file '$f'" >> concat.txt
          done

          VIDEO_OUT="out/Emas di Jarimu Bukan Buatan Bumi - Naysi - 1440x2560 90fps.mp4"
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -i public/audio/master.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -c:a aac -b:a 320k -ar 48000 \
            -movflags +faststart \
            "$VIDEO_OUT"

          {
            echo "=== VIDEO STREAM ==="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
            echo "=== AUDIO STREAM ==="
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels,bit_rate \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
          } | tee out/qa/probe.txt

          TIMES=(2.10 7.90 10.90 15.60 25.50 32.10 39.80 48.90 55.80 63.80 71.80 79.60 84.80 94.60 104.20 110.20)
          for idx in "${!TIMES[@]}"; do
            num=$(printf "%02d" $((idx + 1)))
            ffmpeg -y -v error -ss "${TIMES[$idx]}" -i "$VIDEO_OUT" -frames:v 1 -vf "scale=540:960" "out/qa/f_${num}.jpg"
          done
          ffmpeg -y -v error -start_number 1 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x05070B" "out/qa/qa_sheet_1.jpg"
          ffmpeg -y -v error -start_number 9 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x05070B" "out/qa/qa_sheet_2.jpg"
          ffmpeg -y -v error -ss 7.90 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch1.jpg"
          ffmpeg -y -v error -ss 15.60 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch2.jpg"
          ffmpeg -y -v error -ss 32.10 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch3.jpg"
          ffmpeg -y -v error -ss 48.90 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch4.jpg"
          ffmpeg -y -v error -ss 63.80 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch5.jpg"
          ffmpeg -y -v error -ss 79.60 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch6.jpg"
          ffmpeg -y -v error -ss 94.60 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch7.jpg"
          ffmpeg -y -v error -ss 110.20 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch8.jpg"
          rm -f out/qa/f_*.jpg

          cat << 'PAKET_EOF' > "out/Paket YouTube - Emas di Jarimu Bukan Buatan Bumi.txt"
          Judul:
          Emas di Jarimu Bukan Buatan Bumi

          Deskripsi:
          Emas yang melingkar di jarimu sebenarnya bukan buatan Bumi. Sejak terbentuk 4,5 miliar tahun lalu, planet kita tidak pernah sanggup menciptakan satu gram emas pun. Setiap perhiasan emas yang kita sentuh hari ini lahir dari salah satu tabrakan paling ekstrem di alam semesta.

          0:00 Emas di jarimu bukan buatan planet Bumi
          0:11 Gunung berapi & magma cuma kurir pengangkut emas
          0:22 Tungku bintang raksasa padam saat intinya jadi besi
          0:36 Tabrakan dua bintang neutron & ledakan kilonova
          0:52 Awan emas ratusan Bulan vs 1 kubus emas manusia
          1:06 Emas awal tenggelam ke inti, ditabur ulang hujan meteor
          1:22 Bukti 17 Agustus 2017 dari 70 teleskop dunia (GW170817)
          1:40 Fosil bintang mati yang lebih tua dari Matahari

          Gunung berapi dan aliran magma panas di bawah tanah ternyata hanya mengangkut emas yang sudah lebih dulu ada di mantel Bumi menuju celah batuan kuarsa di dekat permukaan. Panas perut Bumi — bahkan suhu jutaan derajat di pusat bintang raksasa sekalipun — belum mampu merakit inti atom seberat emas (nomor atom 79). Reaksi fusi di dalam bintang berhenti pada unsur besi (nomor atom 26) karena penggabungan inti besi justru menyerap energi, membuat bintang padam dan runtuh oleh gravitasinya sendiri.

          Unsur berat seperti emas baru tercipta lewat proses tangkapan neutron cepat (r-process) ketika dua bintang neutron — sisa inti bintang mati yang memadatkan massa lebih berat dari Matahari ke dalam bola seukuran kota — saling berpilin dan menghantam dalam ledakan kilonova. Dalam hitungan detik, satu ledakan kilonova sanggup menyemburkan awan emas murni seberat puluhan hingga ratusan kali massa Bulan. Sebagai perbandingan, seluruh emas yang pernah ditambang manusia sepanjang sejarah hanya akan membentuk satu kubus padat bersisi sekitar 21 meter.

          Saat Bumi muda masih berupa lautan magma cair 4,5 miliar tahun lalu, hampir semua emas awalnya tertarik bersama besi cair tenggelam ke inti terdalam Bumi. Emas yang bisa ditambang manusia di kerak Bumi hari ini datang belakangan, ditaburkan oleh hujan meteor raksasa sekitar 3,9 miliar tahun lalu. Asal-usul kosmik ini terbukti langsung pada 17 Agustus 2017 (peristiwa GW170817 di galaksi NGC 4993, berjarak 130 juta tahun cahaya), ketika detektor gelombang gravitasi LIGO-Virgo dan sekitar 70 observatorium dunia menangkap kilatan pembentukan emas dan platina baru dari tabrakan dua bintang neutron.

          Ada benda emas yang sedang kamu pakai sekarang? Tulis di komentar.

          Sumber: LIGO Scientific Collaboration & Virgo Collaboration, "GW170817: Observation of Gravitational Waves from a Binary Neutron Star Inspiral", Physical Review Letters 119, 161101 (2017); D. Kasen et al., "Origin of the heavy elements in binary neutron-star mergers from a gravitational-wave event", Nature 551, 80–84 (2017); M. Willbold, T. Elliott & S. Moorbath, "The tungsten isotopic composition of the Earth's mantle before the terminal bombardment", Nature 477, 195–198 (2011).

          Naysi — penjelasan singkat soal sains, sejarah, dan angka di baliknya.
          Kerja sama: elths.i09@gmail.com

          Hashtag:
          #Shorts #Astronomi #Sains #FaktaUnik #Emas

          Tag:
          asal usul emas, emas bukan dari bumi, emas dari tabrakan bintang, bintang neutron, ledakan kilonova, gw170817, kenapa bumi tidak bisa membuat emas, inti besi bintang, hujan meteor emas, fakta emas, fakta astronomi, fisika bintang, kosmos, alam semesta, sains populer, ilmu pengetahuan, wawasan baru, fakta menarik, edukasi, naysi, shorts indonesia
          PAKET_EOF
          sed -i 's/^          //' "out/Paket YouTube - Emas di Jarimu Bukan Buatan Bumi.txt"
          ls -lh out/ out/qa/
      - name: Register Git object deliverables manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          def api_post(path, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def upload_blob(raw_bytes):
              res = api_post("git/blobs", {
                  "content": base64.b64encode(raw_bytes).decode("ascii"),
                  "encoding": "base64",
              })
              return res["sha"]

          tree_items = []
          video_path = "out/Emas di Jarimu Bukan Buatan Bumi - Naysi - 1440x2560 90fps.mp4"
          chunk_size = 18 * 1024 * 1024
          with open(video_path, "rb") as vf:
              idx = 0
              while True:
                  buf = vf.read(chunk_size)
                  if not buf:
                      break
                  bsha = upload_blob(buf)
                  tree_items.append({
                      "path": f"video_part_{idx:02d}.bin",
                      "mode": "100644",
                      "type": "blob",
                      "sha": bsha,
                  })
                  idx += 1

          extra_files = {
              "paket.txt": "out/Paket YouTube - Emas di Jarimu Bukan Buatan Bumi.txt",
              "probe.txt": "out/qa/probe.txt",
              "qa_sheet_1.jpg": "out/qa/qa_sheet_1.jpg",
              "qa_sheet_2.jpg": "out/qa/qa_sheet_2.jpg",
              "hi_ch1.jpg": "out/qa/hi_ch1.jpg",
              "hi_ch2.jpg": "out/qa/hi_ch2.jpg",
              "hi_ch3.jpg": "out/qa/hi_ch3.jpg",
              "hi_ch4.jpg": "out/qa/hi_ch4.jpg",
              "hi_ch5.jpg": "out/qa/hi_ch5.jpg",
              "hi_ch6.jpg": "out/qa/hi_ch6.jpg",
              "hi_ch7.jpg": "out/qa/hi_ch7.jpg",
              "hi_ch8.jpg": "out/qa/hi_ch8.jpg",
          }
          for name, fpath in extra_files.items():
              with open(fpath, "rb") as ef:
                  bsha = upload_blob(ef.read())
              tree_items.append({
                  "path": name,
                  "mode": "100644",
                  "type": "blob",
                  "sha": bsha,
              })

          tree = api_post("git/trees", {"tree": tree_items})
          tree_sha = tree["sha"]
          api_post(f"statuses/{sha}", {
              "state": "success",
              "context": "naysi/deliverables",
              "description": f"tree:{tree_sha}",
          })
          print("Registered deliverables tree:", tree_sha)
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: naysi-master-deliverables
          path: |
            out/*.mp4
            out/*.txt
            out/qa/*.jpg
            out/qa/*.txt
          compression-level: 0
          retention-days: 30
