# Render the film on GitHub's machines.
#
# Nothing about the picture needs this repo's original sandbox: a runner with
# Node, Chromium and ffmpeg is enough. So the render lives here, and the
# workstation only ever pushes a script and collects an artifact.
#
#   Actions ▸ Render ▸ Run workflow
#
# Outputs (kept 30 days, published as a release when you tag a run):
#   out/naysi_master.mp4   the film, with audio muxed
#   out/naysi_pack.zip     title / description / hashtags / tags
#   out/still-<s>.png      12 stills, one per shot, for review without a player
name: Render

on:
  workflow_dispatch:
    inputs:
      stills_only:
        description: 'Only render review stills (no full film)'
        type: boolean
        default: false
      release_tag:
        description: 'If set, publish the render as a release with this tag'
        type: string
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish a release when asked

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: |
          npm ci
          python3 -m pip install --quiet --break-system-packages numpy
          # Remotion downloads its own headless shell on first render; do it once
          # here so the render step does not race on it.
          npx remotion browser ensure || echo "note: using the runner's chrome"

      - name: typecheck
        run: npx tsc --noEmit

      - name: narration + timeline + score + master bus
        run: node scripts/build.mjs --audio-only

      - name: render stills
        run: |
          mkdir -p out
          node -e '
            const tl = require("./src/data/timeline.json");
            const picks = tl.shots.map((s) => Math.round((s.startFrame + s.outFrame) / 2));
            console.log(picks.join(" "));
          ' > /tmp/frames.txt
          for f in $(cat /tmp/frames.txt); do
            npx remotion still src/index.ts Specimen "out/still-$f.png" --frame="$f"
          done
          ls -la out

      - name: render film
        if: ${{ !inputs.stills_only }}
        run: |
          set -o pipefail
          node scripts/build.mjs --render-only 2>&1 | tee out/render.log

      - name: probe
        if: ${{ !inputs.stills_only }}
        run: |
          ffprobe -v error -show_entries \
            stream=codec_name,width,height,r_frame_rate,pix_fmt,bit_rate:format=duration,size \
            -of default=noprint_wrappers=1 out/naysi_master.mp4 | tee out/probe.txt
          # A 76 s 1440x2560 film that comes out under 3 MB is a broken render,
          # not a good encode: fail rather than ship a black rectangle.
          test "$(stat -c%s out/naysi_master.mp4)" -gt 3000000
          ffmpeg -v error -i out/naysi_master.mp4 -f null - && echo "decode ok"

      - uses: actions/upload-artifact@v4
        with:
          name: naysi-${{ github.run_number }}
          path: |
            out/still-*.png
            out/naysi_master.mp4
            out/naysi_pack.zip
            out/probe.txt
            out/render.log
          if-no-files-found: warn
          retention-days: 30

      - name: publish release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            out/naysi_master.mp4
            out/naysi_pack.zip
          body: |
            Rendered from `${{ github.sha }}` on a GitHub runner.
            Duration and probe output are in the run's artifacts.
