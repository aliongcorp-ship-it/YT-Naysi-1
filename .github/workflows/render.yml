name: Render 2K 90FPS Master

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  render-shard:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 0
            range: '0-1769'
          - shard: 1
            range: '1770-3539'
          - shard: 2
            range: '3540-5309'
          - shard: 3
            range: '5310-7079'
          - shard: 4
            range: '7080-8849'
          - shard: 5
            range: '8850-10618'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render shard ${{ matrix.shard }} (${{ matrix.range }})
        run: |
          mkdir -p out
          npx remotion render scenes/y3.tsx Naysi "out/shard_${{ matrix.shard }}.mp4" \
            --frames="${{ matrix.range }}" \
            --muted \
            --codec=h264 \
            --crf=18 \
            --pixel-format=yuv420p \
            --jpeg-quality=94 \
            --concurrency=4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard_${{ matrix.shard }}.mp4
          compression-level: 0
          retention-days: 5

  assemble:
    needs: render-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Concatenate 2K 90fps shards and mux 320kbps audio
        run: |
          set -euo pipefail
          mkdir -p out/qa
          rm -f concat.txt
          for i in 0 1 2 3 4 5; do
            f=$(find "shards/shard-${i}" -name "shard_${i}.mp4" | head -n 1)
            test -n "$f" && test -s "$f"
            echo "file '$f'" >> concat.txt
          done

          VIDEO_OUT="out/10 Hari di Oktober 1582 Hilang dari Kalender - Naysi - 1440x2560 90fps.mp4"
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -i public/audio/master.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -c:a aac -b:a 320k -ar 48000 \
            -movflags +faststart \
            "$VIDEO_OUT"

          {
            echo "=== VIDEO STREAM ==="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
            echo "=== AUDIO STREAM ==="
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels,bit_rate \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
          } | tee out/qa/probe.txt

          TIMES=(4.15 11.0 14.18 25.2 31.0 35.8 43.0 51.8 59.5 64.0 75.5 83.2 91.5 100.5 110.8 115.8)
          for idx in "${!TIMES[@]}"; do
            num=$(printf "%02d" $((idx + 1)))
            ffmpeg -y -v error -ss "${TIMES[$idx]}" -i "$VIDEO_OUT" -frames:v 1 -vf "scale=540:960" "out/qa/f_${num}.jpg"
          done
          ffmpeg -y -v error -start_number 1 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x0D0E12" "out/qa/qa_sheet_1.jpg"
          ffmpeg -y -v error -start_number 9 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x0D0E12" "out/qa/qa_sheet_2.jpg"
          ffmpeg -y -v error -ss 11.0 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch1.jpg"
          ffmpeg -y -v error -ss 35.8 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch3.jpg"
          ffmpeg -y -v error -ss 64.0 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch5.jpg"
          ffmpeg -y -v error -ss 83.2 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch6.jpg"
          ffmpeg -y -v error -ss 100.5 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch7.jpg"
          ffmpeg -y -v error -ss 115.8 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch8.jpg"
          rm -f out/qa/f_*.jpg

          cat << 'PAKET_EOF' > "out/Paket YouTube - 10 Hari di Oktober 1582 Hilang dari Kalender.txt"
          Judul:
          10 Hari di Oktober 1582 Hilang dari Kalender

          Deskripsi:
          Pada Oktober 1582, sepuluh hari dihapus begitu saja dari kalender dunia. Orang tidur pada malam Kamis 4 Oktober 1582, lalu terbangun keesokan paginya langsung pada Jumat 15 Oktober 1582. Tanggal 5 sampai 14 Oktober 1582 tidak pernah ada dalam catatan sejarah.

          0:00 Kamis 4 Oktober langsung lompat ke Jumat 15 Oktober 1582
          0:14 Kalender Julian buatan Julius Caesar (365,25 hari)
          0:28 Orbit asli Bumi lebih cepat 11 menit 14 detik per tahun
          0:38 Meleset 1 hari tiap 128 tahun, menumpuk jadi 10 hari di 1582
          0:54 Dekret Paus Gregorius XIII & astronom Aloysius Lilius
          1:08 Rahasia tahun 1700, 1800, 1900 bukan kabisat vs tahun 2000
          1:25 Inggris potong 11 hari (1752) & Rusia potong 13 hari (1918)
          1:44 Cek Oktober 1582 di kalender ponselmu

          Penyebabnya berawal dari kalender Julian yang ditetapkan Julius Caesar pada 45 SM. Kalender Julian mematok satu tahun rata-rata tepat 365,25 hari (365 hari 6 jam) dengan satu tahun kabisat setiap empat tahun tanpa pengecualian. Padahal, satu putaran tropik Bumi mengelilingi Matahari sebenarnya memakan waktu sekitar 365,2422 hari (365 hari 5 jam 48 menit 46 detik) — selisih sekitar 11 menit 14 detik lebih singkat setiap tahun.

          Selisih 11 menit per tahun itu menumpuk menjadi satu hari penuh setiap 128 tahun. Memasuki abad ke-16, posisi Matahari pada titik balik musim semi sudah bergeser sepuluh hari lebih awal dari tanggal 21 Maret di kalender. Melalui bulla kepausan Inter Gravissimas (24 Februari 1582), Paus Gregorius XIII bersama perhitungan astronom Aloysius Lilius dan matematikawan Christopher Clavius memotong 10 tanggal pada Oktober 1582 tanpa memutus siklus hari pekan Kamis ke Jumat.

          Supaya pergeseran serupa tidak terulang, aturan tahun kabisat ikut diperbarui: tahun abad bulat (habis dibagi 100 seperti 1700, 1800, dan 1900) tidak lagi menjadi tahun kabisat, kecuali yang juga habis dibagi 400 seperti 1600 dan 2000. Hasilnya, rata-rata tahun Gregorian menjadi 365,2425 hari — baru meleset satu hari dalam sekitar 3.236 tahun.

          Negara yang menunda pergantian kalender terpaksa memotong lebih banyak hari karena melewati tahun-tahun abad tersebut: Inggris dan koloni Amerika memotong 11 hari pada September 1752 (2 September langsung ke 14 September), sementara Rusia baru beralih pada 1918 dan harus melompati 13 hari sekaligus (31 Januari langsung ke 14 Februari).

          Coba cek Oktober 1582 di kalender ponselmu — apakah tanggal 5 sampai 14 ikut hilang? Tulis di komentar.

          Sumber: Paus Gregorius XIII, Bulla "Inter gravissimas" (24 Februari 1582); Christopher Clavius, "Romani calendarii a Gregorio XIII P.M. restituti explicatio" (Roma, 1603); U.S. Naval Observatory, "Introduction to Calendars" (Astronomical Applications Department); Apple Developer Documentation, "Historical Dates — NSCalendar Julian to Gregorian Transition (October 1582)".

          Naysi — penjelasan singkat soal sains, sejarah, dan angka di baliknya.

          Hashtag:
          #Shorts #Sejarah #Astronomi #FaktaUnik #Sains

          Tag:
          oktober 1582, 10 hari hilang dari kalender, kenapa 5 sampai 14 oktober 1582 hilang, kalender oktober 1582, kalender gregorian, kalender julian, julius caesar, paus gregorius xiii, aloysius lilius, tahun kabisat, aturan tahun kabisat, tahun 1900 bukan kabisat, fakta sejarah, fakta astronomi, orbit bumi, sejarah dunia, kalender hp oktober 1582, sains populer, wawasan baru, ilmu pengetahuan, fakta menarik, edukasi, naysi, shorts indonesia
          PAKET_EOF
          ls -lh out/ out/qa/
      - name: Register Git object deliverables manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          def api_post(path, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def upload_blob(raw_bytes):
              res = api_post("git/blobs", {
                  "content": base64.b64encode(raw_bytes).decode("ascii"),
                  "encoding": "base64",
              })
              return res["sha"]

          tree_items = []
          video_path = "out/10 Hari di Oktober 1582 Hilang dari Kalender - Naysi - 1440x2560 90fps.mp4"
          chunk_size = 18 * 1024 * 1024
          with open(video_path, "rb") as vf:
              idx = 0
              while True:
                  buf = vf.read(chunk_size)
                  if not buf:
                      break
                  bsha = upload_blob(buf)
                  tree_items.append({
                      "path": f"video_part_{idx:02d}.bin",
                      "mode": "100644",
                      "type": "blob",
                      "sha": bsha,
                  })
                  idx += 1

          extra_files = {
              "paket.txt": "out/Paket YouTube - 10 Hari di Oktober 1582 Hilang dari Kalender.txt",
              "probe.txt": "out/qa/probe.txt",
              "qa_sheet_1.jpg": "out/qa/qa_sheet_1.jpg",
              "qa_sheet_2.jpg": "out/qa/qa_sheet_2.jpg",
              "hi_ch1.jpg": "out/qa/hi_ch1.jpg",
              "hi_ch3.jpg": "out/qa/hi_ch3.jpg",
              "hi_ch5.jpg": "out/qa/hi_ch5.jpg",
              "hi_ch6.jpg": "out/qa/hi_ch6.jpg",
              "hi_ch7.jpg": "out/qa/hi_ch7.jpg",
              "hi_ch8.jpg": "out/qa/hi_ch8.jpg",
          }
          for name, fpath in extra_files.items():
              with open(fpath, "rb") as ef:
                  bsha = upload_blob(ef.read())
              tree_items.append({
                  "path": name,
                  "mode": "100644",
                  "type": "blob",
                  "sha": bsha,
              })

          tree = api_post("git/trees", {"tree": tree_items})
          tree_sha = tree["sha"]
          api_post(f"statuses/{sha}", {
              "state": "success",
              "context": "naysi/deliverables",
              "description": f"tree:{tree_sha}",
          })
          print("Registered deliverables tree:", tree_sha)
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: naysi-master-deliverables
          path: |
            out/*.mp4
            out/*.txt
            out/qa/*.jpg
            out/qa/*.txt
          compression-level: 0
          retention-days: 30
