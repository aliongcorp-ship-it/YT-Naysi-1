name: Render 2K 90FPS Master

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  render-shard:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard: 0
            range: '0-1747'
          - shard: 1
            range: '1748-3495'
          - shard: 2
            range: '3496-5243'
          - shard: 3
            range: '5244-6991'
          - shard: 4
            range: '6992-8739'
          - shard: 5
            range: '8740-10489'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render shard ${{ matrix.shard }} (${{ matrix.range }})
        run: |
          mkdir -p out
          npx remotion render scenes/y3.tsx Naysi "out/shard_${{ matrix.shard }}.mp4" \
            --frames="${{ matrix.range }}" \
            --muted \
            --codec=h264 \
            --crf=18 \
            --pixel-format=yuv420p \
            --jpeg-quality=94 \
            --concurrency=4
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard_${{ matrix.shard }}.mp4
          compression-level: 0
          retention-days: 5

  assemble:
    needs: render-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Concatenate 2K 90fps shards and mux 320kbps audio
        run: |
          set -euo pipefail
          mkdir -p out/qa
          rm -f concat.txt
          for i in 0 1 2 3 4 5; do
            f=$(find "shards/shard-${i}" -name "shard_${i}.mp4" | head -n 1)
            test -n "$f" && test -s "$f"
            echo "file '$f'" >> concat.txt
          done

          VIDEO_OUT="out/Bau Hujan Itu Bukan Aroma Air, Tapi Jebakan Bakteri - Naysi - 1440x2560 90fps.mp4"
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -i public/audio/master.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -c:a aac -b:a 320k -ar 48000 \
            -movflags +faststart \
            "$VIDEO_OUT"

          {
            echo "=== VIDEO STREAM ==="
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
            echo "=== AUDIO STREAM ==="
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels,bit_rate \
              -of default=noprint_wrappers=1 "$VIDEO_OUT"
          } | tee out/qa/probe.txt

          TIMES=(2.20 6.80 14.20 21.50 29.80 39.20 48.50 56.50 64.20 70.80 79.80 86.20 93.20 99.50 107.20 114.20)
          for idx in "${!TIMES[@]}"; do
            num=$(printf "%02d" $((idx + 1)))
            ffmpeg -y -v error -ss "${TIMES[$idx]}" -i "$VIDEO_OUT" -frames:v 1 -vf "scale=540:960" "out/qa/f_${num}.jpg"
          done
          ffmpeg -y -v error -start_number 1 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x090D0C" "out/qa/qa_sheet_1.jpg"
          ffmpeg -y -v error -start_number 9 -i "out/qa/f_%02d.jpg" -frames:v 1 -vf "tile=4x2:padding=8:color=0x090D0C" "out/qa/qa_sheet_2.jpg"

          ffmpeg -y -v error -ss 6.80 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch1.jpg"
          ffmpeg -y -v error -ss 14.80 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch2a.jpg"
          ffmpeg -y -v error -ss 21.50 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch2.jpg"
          ffmpeg -y -v error -ss 39.20 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch3.jpg"
          ffmpeg -y -v error -ss 48.50 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch4a.jpg"
          ffmpeg -y -v error -ss 56.50 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch4.jpg"
          ffmpeg -y -v error -ss 70.80 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch5.jpg"
          ffmpeg -y -v error -ss 79.80 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch6a.jpg"
          ffmpeg -y -v error -ss 86.20 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch6.jpg"
          ffmpeg -y -v error -ss 98.50 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch7.jpg"
          ffmpeg -y -v error -ss 113.80 -i "$VIDEO_OUT" -frames:v 1 "out/qa/hi_ch8.jpg"
          rm -f out/qa/f_*.jpg

          cat << 'PAKET_EOF' > "out/Paket YouTube - Bau Hujan Itu Bukan Aroma Air, Tapi Jebakan Bakteri.txt"
          Judul:
          Bau Hujan Itu Bukan Aroma Air, Tapi Jebakan Bakteri

          Deskripsi:
          Aroma khas yang langsung tercium saat gerimis pertama turun sebenarnya sama sekali bukan bau air hujan. Air hujan murni tidak memiliki bau sedikit pun — wangi hangat yang kita kenal sebagai petrikor itu ternyata jebakan kimia berusia ratusan juta tahun yang dipasang bakteri tanah.

          0:00 Bau hujan ternyata bukan aroma air langit
          0:11 Kamera MIT: gerimis pelan meletupkan kabut pembawa bau
          0:26 Bakteri Streptomyces peracik antibiotik & geosmin
          0:43 1 sendok teh di 400 kolam Olimpiade (200.000x hiu)
          0:59 Riset 2020: umpan pemancing kutu pegas tanah
          1:14 Spora tahan dicerna & lontaran kurir ekor pegas
          1:29 Kompas alami manusia purba & unta melacak mata air
          1:42 Paradoks geosmin pada bau lumpur ikan lele & gurame

          Rekaman kamera kecepatan tinggi di Massachusetts Institute of Technology (MIT) membuktikan bagaimana aroma dari dalam tanah sanggup melompat ke hidung kita. Ketika tetes gerimis pelan menimpa tanah kering berpori, air mengurung gelembung udara mikroskopis yang kemudian meletup ke atas seperti buih soda, melontarkan ratusan butir aerosol halus pembawa molekul wangi yang diterbangkan angin mendahului awan hujan.

          Peracik utama aroma tersebut adalah bakteri benang tanah bernama Streptomyces — keluarga mikroba yang juga berjasa menghasilkan sekitar dua pertiga antibiotik medis dunia. Saat musim kemarau mengeringkan tanah, koloni Streptomyces yang terancam mati membentuk spora keras sambil melepaskan molekul alkohol bisiklik bernama geosmin (C12H22O). Hidung manusia luar biasa peka terhadap geosmin hingga sanggup menciumnya pada kadar 5 bagian per triliun — setara satu sendok teh di dalam 400 kolam renang Olimpiade, atau sekitar 200.000 kali lebih tajam daripada penciuman hiu terhadap darah di laut.

          Pada tahun 2020, riset di Nature Microbiology akhirnya terpecahkan: geosmin sesungguhnya adalah umpan evolusi berusia ratusan juta tahun untuk memancing kutu pegas (Collembola), arthropoda tanah seukuran ujung jarum yang memiliki reseptor khusus geosmin di ujung antenanya. Saat kutu pegas melahap koloni bakteri itu, cangkang spora Streptomyces bertahan utuh di saluran pencernaannya dan menempel di bulu tubuhnya, lalu ikut terlontar jauh bersama pegas ekornya ke tanah lembap baru. Uniknya, molekul geosmin yang persis sama juga menjadi penyebab sensasi "bau tanah" pada ikan air tawar seperti lele dan gurame yang dibenci lidah manusia, sementara hidung kita memujanya sebagai tanda datangnya air dan kehidupan.

          Saat gerimis pertama turun, kamu tim langsung keluar menghirup udaranya atau tetap di dalam rumah? Tulis di komentar.

          Sumber: P. G. Becher et al., "Developmentally regulated volatiles geosmin and 2-methylisoborneol attract a soil arthropod to Streptomyces bacteria promoting spore dispersal", Nature Microbiology 5, 821–829 (2020); Y. S. Joung & C. R. Buie, "Aerosol generation by raindrop impact on soil", Nature Communications 6, 6083 (2015); I. J. Bear & R. G. Thomas, "Nature of argillaceous odour", Nature 201, 993–995 (1964).

          Naysi — penjelasan singkat soal sains, sejarah, dan angka di baliknya.
          Kerja sama: elths.i09@gmail.com

          Hashtag:
          #Shorts #Sains #Biologi #FaktaUnik #Hujan

          Tag:
          bau hujan, kenapa hujan berbau wangi, petrikor, petrichor adalah, geosmin, bakteri tanah, streptomyces, kutu pegas, fakta hujan, kenapa suka bau hujan, bau tanah saat hujan, bau tanah ikan lele, fakta biologi, fakta unik dunia, penciuman manusia vs hiu, sains populer, edukasi, ilmu pengetahuan, wawasan baru, naysi, shorts indonesia
          PAKET_EOF
          sed -i 's/^          //' "out/Paket YouTube - Bau Hujan Itu Bukan Aroma Air, Tapi Jebakan Bakteri.txt"
          ls -lh out/ out/qa/
      - name: Register Git object deliverables manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]

          def api_post(path, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def upload_blob(raw_bytes):
              res = api_post("git/blobs", {
                  "content": base64.b64encode(raw_bytes).decode("ascii"),
                  "encoding": "base64",
              })
              return res["sha"]

          tree_items = []
          video_path = "out/Bau Hujan Itu Bukan Aroma Air, Tapi Jebakan Bakteri - Naysi - 1440x2560 90fps.mp4"
          chunk_size = 18 * 1024 * 1024
          with open(video_path, "rb") as vf:
              idx = 0
              while True:
                  buf = vf.read(chunk_size)
                  if not buf:
                      break
                  bsha = upload_blob(buf)
                  tree_items.append({
                      "path": f"video_part_{idx:02d}.bin",
                      "mode": "100644",
                      "type": "blob",
                      "sha": bsha,
                  })
                  idx += 1

          extra_files = {
              "paket.txt": "out/Paket YouTube - Bau Hujan Itu Bukan Aroma Air, Tapi Jebakan Bakteri.txt",
              "probe.txt": "out/qa/probe.txt",
              "qa_sheet_1.jpg": "out/qa/qa_sheet_1.jpg",
              "qa_sheet_2.jpg": "out/qa/qa_sheet_2.jpg",
              "hi_ch1.jpg": "out/qa/hi_ch1.jpg",
              "hi_ch2a.jpg": "out/qa/hi_ch2a.jpg",
              "hi_ch2.jpg": "out/qa/hi_ch2.jpg",
              "hi_ch3.jpg": "out/qa/hi_ch3.jpg",
              "hi_ch4a.jpg": "out/qa/hi_ch4a.jpg",
              "hi_ch4.jpg": "out/qa/hi_ch4.jpg",
              "hi_ch5.jpg": "out/qa/hi_ch5.jpg",
              "hi_ch6a.jpg": "out/qa/hi_ch6a.jpg",
              "hi_ch6.jpg": "out/qa/hi_ch6.jpg",
              "hi_ch7.jpg": "out/qa/hi_ch7.jpg",
              "hi_ch8.jpg": "out/qa/hi_ch8.jpg",
          }
          for name, fpath in extra_files.items():
              with open(fpath, "rb") as ef:
                  bsha = upload_blob(ef.read())
              tree_items.append({
                  "path": name,
                  "mode": "100644",
                  "type": "blob",
                  "sha": bsha,
              })

          tree = api_post("git/trees", {"tree": tree_items})
          tree_sha = tree["sha"]
          api_post(f"statuses/{sha}", {
              "state": "success",
              "context": "naysi/deliverables",
              "description": f"tree:{tree_sha}",
          })
          print("Registered deliverables tree:", tree_sha)
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: naysi-master-deliverables
          path: |
            out/*.mp4
            out/*.txt
            out/qa/*.jpg
            out/qa/*.txt
          compression-level: 0
          retention-days: 30
