name: Render check
on:
  push:
    paths:
      - render.sh
      - .github/workflows/render-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=s=360x640:r=30:d=1 -c:v libx264 test.mp4
          ffmpeg -loglevel error -f lavfi -i sine=d=1 voice.wav
          ./render.sh test.mp4 voice.wav result.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 result.mp4)" = '1440,2560,90/1'
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 result.mp4)" = aac
